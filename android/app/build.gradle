plugins { id 'com.android.application' }
android {
    namespace 'com.ihab.lenssim'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ihab.lenssim'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('ihab-release.jks')
            storePassword 'ihab-lens-2026'
            keyAlias 'ihab'
            keyPassword 'ihab-lens-2026'
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions = ['edition']
    productFlavors {
        lite {   // for friends: simulator only (no fitting card → nothing goes to Ihab's sheet)
            dimension 'edition'
            buildConfigField 'String', 'UA_TAG', '"IHABApk"'
            buildConfigField 'String', 'START', '"?apk=1"'
            resValue 'string', 'app_name', 'IHAB LensForm 3D'
        }
        full {   // Ihab's own copy: simulator + fitting card
            dimension 'edition'
            applicationIdSuffix '.full'
            buildConfigField 'String', 'UA_TAG', '"IHABApkFull"'
            buildConfigField 'String', 'START', '"?apk=full"'
            resValue 'string', 'app_name', 'IHAB LensForm 3D'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
