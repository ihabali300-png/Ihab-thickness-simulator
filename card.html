<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IHAB Fitting Card</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050f08">
<link rel="icon" href="icon-512.png">
<style>
  :root{ --lime:#a3e635; --lime2:#d9f99d; --box:#06140b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ background:radial-gradient(circle at center, #2c3430 0%, #0d1310 100%); color:#e7f7d2; font-family:"Segoe UI", Tahoma, Arial, sans-serif; }
  header{ position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px;
          padding:8px 12px; background:#050f08; border-bottom:1px solid #a3e63599; box-shadow:0 2px 14px #a3e63533; }
  header h1{ margin:0; font-size:15px; color:var(--lime); white-space:nowrap; }
  .tools{ position:sticky; top:41px; z-index:4; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding:7px 10px;
          background:#07140c; border-bottom:1px solid #a3e63533; max-width:440px; margin:0 auto; }
  .tbtn{ display:flex; flex-direction:column; align-items:center; gap:1px; background:#030a05; color:var(--lime); border:1px solid #a3e63566;
         border-radius:10px; padding:5px 2px; font-size:17px; cursor:pointer; text-decoration:none; line-height:1.1; }
  .tbtn span{ font-size:11.5px; color:#e7f7d2; }
  .tbtn.main{ background:var(--lime); color:#0b1a0f; } .tbtn.main span{ color:#0b1a0f; font-weight:800; }
  .ordbox{ display:flex; direction:ltr; flex-direction:row; align-items:center; justify-content:flex-start; background:var(--box); border:1px solid #a3e63550; border-radius:7px; height:38px; overflow:hidden; }
  .ordbox .pre{ padding:0 4px 0 10px; color:var(--lime); font-family:Consolas, monospace; font-weight:700; font-size:14px; white-space:nowrap; }
  .ordbox input{ border:none !important; height:36px !important; padding:0 10px 0 2px !important; flex:1; min-width:0; text-align:left; }   /* whole right side is the tap target */
  .ordbox input:focus{ outline:none; }
  /* search sheet */
  #sheet{ position:fixed; inset:0; z-index:20; background:#030805; display:none; flex-direction:column; }
  #sheet.on{ display:flex; }
  #sheet .top{ display:flex; gap:8px; padding:10px; border-bottom:1px solid #a3e63544; }
  #sheet .top input{ flex:1; height:42px; font-size:15px; }
  #sheet .top button{ background:#173a22; color:var(--lime); border:1px solid var(--lime); border-radius:8px; padding:0 14px; font-size:15px; cursor:pointer; }
  #sheet .list{ flex:1; overflow-y:auto; padding:8px 10px 30px; max-width:440px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
  #sheet .hint{ font-size:12px; color:#9fbf7a; text-align:center; padding:6px; }
  .hbtns{ display:flex; gap:6px; }
  .hbtn{ background:var(--lime); color:#0b1a0f; font-weight:800; border:none; border-radius:9px; padding:6px 12px; font-size:13px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .hbtn.alt{ background:transparent; color:var(--lime); border:1px solid var(--lime); }
  main{ max-width:420px; margin:0 auto; padding:12px 10px 40px; }
  .sec{ border:1px solid #a3e63533; border-radius:12px; padding:10px 12px; margin-bottom:12px; background:rgba(22,52,30,.55); }
  .sec h2{ color:var(--lime); font-size:14px; margin:0 0 8px; border-bottom:1px solid #a3e63530; padding-bottom:6px; }
  .en{ direction:ltr; unicode-bidi:isolate; font-family:Consolas, monospace; font-weight:700; color:#bef264; }
  /* field row: Arabic label (right) · English + normal range (centred over the box) · box (left) */
  .f{ display:grid; grid-template-columns:158px 124px; justify-content:start; gap:2px 12px; align-items:center; padding:3px 2px 4px;
      border-bottom:1px solid rgba(0,0,0,.6); box-shadow:0 1px 0 rgba(163,230,53,.12); }
  .f:last-child{ border-bottom:none; box-shadow:none; }
  .f .ar{ font-size:13.5px; }
  .f .ar small{ display:block; color:#9fbf7a; font-size:11px; margin-top:2px; }
  .f .cell{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .f .cell .en{ font-size:15px; white-space:nowrap; }
  .f .cell{ gap:1px !important; }
  .wide .head .en{ font-size:15px; }
  .wide{ justify-content:stretch !important; grid-template-columns:1fr !important; }
  select, input[type=text], textarea{
    background:var(--box); color:var(--lime2); border:1px solid #a3e63550; border-radius:7px; font-size:14px;
    font-family:Consolas, monospace; direction:ltr;
  }
  select{ width:78px; height:32px; text-align:center; text-align-last:center; }
  select.warn{ border-color:#f87171; color:#fecaca; }
  input[type=text]{ width:100%; height:38px; padding:0 10px; }
  .wide{ grid-template-columns:1fr; }
  .wide .head{ display:flex; justify-content:flex-start; gap:14px; align-items:baseline; }
  .wide input[type=text], .wide .ordbox{ width:270px; max-width:100%; }
  textarea{ width:100%; height:56px; padding:6px 10px; direction:rtl; font-family:inherit; }
  .grp{ background:rgba(0,0,0,.28); border:1px solid rgba(0,0,0,.55); border-radius:12px; padding:6px 8px 4px; margin:8px 0;
         box-shadow:inset 0 2px 6px rgba(0,0,0,.65), inset 0 -1px 0 rgba(163,230,53,.10), 0 1px 0 rgba(163,230,53,.12); }
  .grp-h{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--lime);
          padding:0 2px 4px; border-bottom:1px dashed #a3e63540; margin-bottom:2px; }
  .grp-h .en{ font-size:13px; }
  .grp .total{ border-top:1px solid rgba(0,0,0,.6); box-shadow:inset 0 1px 0 rgba(163,230,53,.1); padding:5px 4px 2px; margin-top:2px; }
  .total{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:13px; }
  .total b{ font-family:Consolas, monospace; font-size:18px; color:var(--lime); direction:ltr; }
  .save{ width:100%; background:var(--lime); color:#0b1a0f; font-weight:800; font-size:16px; border:none; border-radius:10px; padding:12px; cursor:pointer; box-shadow:0 0 14px #a3e63566; }
  .save:disabled{ opacity:.5; }
  .row2{ display:grid; grid-template-columns:1fr auto; gap:8px; }
  .sbtn{ background:#173a22; color:var(--lime); border:1px solid var(--lime); border-radius:8px; padding:0 14px; font-size:14px; cursor:pointer; }
  #status{ font-size:12.5px; margin-top:8px; min-height:18px; text-align:center; color:#bef264; }
  #status.err{ color:#fca5a5; }
  .res{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .hit, .res button{ text-align:right; background:#030a05; color:#e7f7d2; border:1px solid #a3e63530; border-radius:8px; padding:8px 10px; cursor:pointer; font-size:12.5px; }
  .hit:hover, .res button:hover{ border-color:var(--lime); }
  .hit .en, .res .en{ font-size:12.5px; }
  .foot{ font-size:11px; color:#9fbf7a; text-align:center; line-height:1.7; }
  .foot a{ color:var(--lime); }

  .sub{ border:1px solid #a3e63533; border-radius:11px; margin:0 0 9px; background:rgba(22,52,30,.55); }
  .sbh{ width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; color:var(--lime);
        font-weight:800; font-size:14.5px; padding:11px 12px; cursor:pointer; font-family:inherit; direction:rtl; }
  .sbh::after{ content:'▾'; font-size:15px; transition:transform .3s; }
  .sub.open > .sbh::after{ transform:rotate(180deg); }
  .sbb{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s ease; }
  .sub.open > .sbb{ grid-template-rows:1fr; }
  .sbb > .in{ overflow:hidden; min-height:0; }
  .pad{ padding:0 10px 10px; }
  .cells{ display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; margin:4px 0; }
  .cell{ display:flex; flex-direction:column; gap:4px; align-items:stretch; background:rgba(0,0,0,.25); border:1px solid rgba(0,0,0,.55); border-radius:10px; padding:5px;
         box-shadow:inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(163,230,53,.10); min-width:0; }
  .cell .cl{ display:flex; flex-direction:column; align-items:center; line-height:1.2; }
  .cell .cl .en{ font-size:13.5px; font-weight:800; white-space:nowrap; }
  .cell .cl .ar{ font-size:10.5px; color:#d9f99dcc; white-space:nowrap; }
  .cell select{ width:100%; height:38px; font-size:15px; font-weight:700; }
  .cell .nr{ font-size:9.5px; color:#9fbf7a; text-align:center; }
  .cell.tot b{ height:38px; display:flex; align-items:center; justify-content:center; font-family:Consolas, monospace; font-size:18px; color:var(--lime);
               background:#030a05; border:1px solid var(--lime); border-radius:7px; direction:ltr; }
  .cell.tot{ cursor:default; }
  .sub textarea{ margin-top:2px; }
  .hitw{ display:flex; gap:6px; align-items:stretch; }
  .hitw .hit{ flex:1; }
  .del{ flex:none; width:52px; background:#2a0b0b; color:#fca5a5; border:1px solid #f8717188; border-radius:8px; font-size:16px; cursor:pointer; }
  .del.sure{ background:#b91c1c; color:#fff; font-size:12.5px; font-weight:800; }
  #q{ font-family:inherit; direction:rtl; }
  #dateBtn.on{ background:var(--lime); color:#0b1a0f; }
  #dateBar{ display:none; padding:8px 10px; border-bottom:1px solid #a3e63544; max-width:440px; width:100%; margin:0 auto; }
  #dateBar.on{ display:block; }
  #dateBar .chips{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:8px; }
  #dateBar button{ background:#030a05; color:#e7f7d2; border:1px solid #a3e63555; border-radius:16px; padding:6px 2px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  #dateBar button.on{ background:var(--lime); color:#0b1a0f; font-weight:800; }
  #dateBar .dr{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:end; }
  #dateBar label{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:#bef264; }
  #dateBar input[type=date]{ background:var(--box); color:var(--lime2); border:1px solid #a3e63550; border-radius:7px; height:38px; padding:0 6px; font-size:13.5px; color-scheme:dark; width:100%; }
  #dateBar #dClear{ border-radius:8px; height:38px; padding:0 8px; font-size:11.5px; color:#fca5a5; border-color:#f8717166; }
  .edt{ flex:none; width:52px; background:#0b1f2a; color:#bae6fd; border:1px solid #38bdf888; border-radius:8px; font-size:16px; cursor:pointer; }
  #editBar{ display:none; justify-content:space-between; align-items:center; gap:8px; background:#0b1f2a; border:1px solid #38bdf888; border-radius:10px;
            padding:8px 10px; margin:0 0 8px; color:#bae6fd; font-size:13px; direction:rtl; }
  #editBar button{ background:none; border:1px solid #f8717188; color:#fca5a5; border-radius:8px; padding:5px 8px; font-size:12px; cursor:pointer; font-family:inherit; }
  .codebox{ display:flex; gap:6px; align-items:stretch; }
  .codebox input{ flex:1; min-width:0; }
  #qrBtn{ flex:none; background:#030a05; color:var(--lime); border:1px solid var(--lime); border-radius:8px; padding:0 10px; font-weight:800; font-size:14px; cursor:pointer; font-family:Consolas, monospace; }
  .att-h{ color:var(--lime); font-weight:800; font-size:13.5px; margin:10px 2px 6px; }
  .att-btns{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .att-btns label{ position:relative; overflow:hidden; text-align:center; background:#030a05; color:#e7f7d2; border:1px solid #a3e63566; border-radius:9px; padding:9px 2px; font-size:13px; font-weight:700; cursor:pointer; }
  .att-btns input{ position:absolute; inset:0; opacity:0; }
  #attList{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; max-width:100%; background:#173a22; border:1px solid #a3e63566; border-radius:16px; padding:4px 6px 4px 10px; font-size:12.5px; color:#ecfccb; direction:ltr; }
  .chip a, .chip span{ color:#d9f99d; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:190px; }
  .chip img{ width:26px; height:26px; object-fit:cover; border-radius:5px; }
  .chip button{ background:none; border:none; color:#fca5a5; font-size:14px; cursor:pointer; padding:0 2px; }
  .chip.saved{ background:#0b1f2a; border-color:#38bdf866; }
  #qrOv{ position:fixed; inset:0; z-index:900; background:#000; display:none; flex-direction:column; }
  #qrOv.on{ display:flex; }
  .qr-top{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; color:#d9f99d; font-weight:700; font-size:14.5px; direction:rtl; }
  .qr-top button{ background:none; border:1px solid #a3e63588; color:#d9f99d; border-radius:9px; width:38px; height:36px; font-size:18px; }
  .qr-wrap{ position:relative; flex:1; overflow:hidden; }
  #qrVid{ width:100%; height:100%; object-fit:cover; }
  .qr-frame{ position:absolute; left:12%; right:12%; top:30%; height:28%; border:3px solid var(--lime); border-radius:14px; box-shadow:0 0 0 9999px #0008, 0 0 18px #a3e635aa; }
  .qr-bot{ padding:14px; display:flex; justify-content:center; }
  .qr-photo{ position:relative; overflow:hidden; background:#173a22; color:#ecfccb; border:1px solid var(--lime); border-radius:10px; padding:10px 18px; font-weight:800; }
  .qr-photo input{ position:absolute; inset:0; opacity:0; }
  #status .fld{ display:inline-block; margin:6px 6px 0; color:#0b1a0f; background:var(--lime); border-radius:8px; padding:4px 10px; font-weight:800; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>🗂️ IHAB Fitting Card</h1>
</header>
<nav class="tools">
  <a class="tbtn" href="./">🔬<span>المحاكي</span></a>
  <button class="tbtn" id="logBtn">🔍<span>السجل</span></button>
  <button class="tbtn" id="resetBtn">↺<span>ريست</span></button>
  <button class="tbtn main" id="newBtn">📄<span>جديد</span></button>
</nav>

<div id="qrOv"><div class="qr-top"><span id="qrMsg">وجّه الكاميرا على QR أو باركود الفريم</span><button id="qrClose">✕</button></div>
  <div class="qr-wrap"><video id="qrVid" playsinline muted></video><div class="qr-frame"></div></div>
  <div class="qr-bot"><label class="qr-photo">📸 صوّره بدل كده<input type="file" id="qrPhoto" accept="image/*" capture="environment"></label></div>
</div>
<main>
  <div class="sub"><button class="sbh"><span>📋 بيانات الطلب</span></button><div class="sbb"><div class="in"><div class="pad">
    <div class="f wide">
      <div class="head"><span class="ar">🏷️ كود الفريم</span><span class="en">Frame Code</span></div>
      <div class="codebox"><input type="text" id="code" placeholder="مثال: SPE-000836-0718" autocomplete="off"><button id="qrBtn" type="button" title="امسح QR / باركود">▦ QR</button></div>
    </div>
    <div class="f wide">
      <div class="head"><span class="ar">🧾 رقم الأوردر</span><span class="en">Order No</span></div>
      <div class="ordbox"><span class="pre">TBK-2500</span><input type="text" id="order" inputmode="numeric" placeholder="....." autocomplete="off"></div>
    </div>
  </div></div></div></div>
<div id="fields"></div>
  <div class="sub"><button class="sbh"><span>📝 ملاحظات</span></button><div class="sbb"><div class="in"><div class="pad">
    <textarea id="notes" placeholder="أي ملاحظة عن التظبيط..."></textarea>
    <div class="att-h">📎 المرفقات</div>
    <div class="att-btns">
      <label>📷 كاميرا<input type="file" id="attCam" accept="image/*" capture="environment"></label>
      <label>🖼️ الاستديو<input type="file" id="attGal" accept="image/*" multiple></label>
      <label>📄 ملف<input type="file" id="attFile" accept="application/pdf,image/*,*/*" multiple></label>
    </div>
    <div id="attList"></div>
  </div></div></div></div>
  <div id="editBar"><span id="editTxt"></span><button id="editCancel">✕ إلغاء التعديل</button></div>
  <button class="save" id="saveBtn">💾 حفظ في الشيت</button>
  <div id="status"></div>

  <div class="foot">
    السجلات بتتحفظ في شيت <a href="https://docs.google.com/spreadsheets/d/1Ni-EX1SgcOJJl8XUmoPzbDkgpV1m3dWTUev6rhmaA5k/edit">IHAB Frame Fitting Records</a><br>
    أي سجل أقدم من سنة بيتمسح تلقائياً مع كل حفظ جديد
  </div>
</main>

<div id="sheet">
  <div class="top">
    <input type="text" id="q" placeholder="🔍 ابحث بالكود أو الأوردر" autocomplete="off">
    <button id="dateBtn" title="فلتر بالتاريخ">📅</button>
    <button id="closeSheet">✕</button>
  </div>
  <div id="dateBar">
    <div class="chips"><button data-d="0">اليوم</button><button data-d="1">إمبارح</button><button data-d="7">آخر 7 أيام</button><button data-d="30">آخر 30 يوم</button></div>
    <div class="dr"><label>من<input type="date" id="dFrom"></label><label>إلى<input type="date" id="dTo"></label><button id="dClear">✕ إلغاء الفلتر</button></div>
  </div>
  <div class="list" id="results"></div>
</div>

<script>
const SHEET_ID = '1Ni-EX1SgcOJJl8XUmoPzbDkgpV1m3dWTUev6rhmaA5k';
const SERVER = 'Google Sheets';
const KEEP_DAYS = 365;   // 1 year
const $ = id => document.getElementById(id);
const range = (a, b, st) => { const o = []; for (let v = a; v <= b + 1e-9; v += st) o.push(Math.round(v * 100) / 100); return o; };

/* Fields of the fitting slip. All dropdowns start at 0. [key, Arabic, English, values, unit, normal range] */
const FIELDS = [
  ['panto', 'البانتو', 'Panto', range(0, 20, 2), '°', [8, 12]],
  ['wrap', 'الالتفاف', 'Wrap', range(0, 20, 0.5), '°', [4, 6]],
  ['bvd', 'بُعد العدسة', 'BVD', range(0, 25, 0.5), 'mm', [10, 15]],
  ['segR', 'يمين', 'Seg R', range(0, 45, 0.5), 'mm', null],
  ['segL', 'يسار', 'Seg L', range(0, 45, 0.5), 'mm', null],
  ['pdR', 'يمين', 'PD R', range(0, 45, 0.5), 'mm', null],
  ['pdL', 'يسار', 'PD L', range(0, 45, 0.5), 'mm', null]
];
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const fieldHTML = ([k, ar, en, vals, unit, nr]) => `
  <div class="cell"><div class="cl"><span class="en">${en}</span><span class="ar">${ar}</span></div>
    <select id="${k}">${vals.map(v => `<option value="${v}">${fmt(v)}${unit === '°' ? '°' : ''}</option>`).join('')}</select>
    ${nr ? `<small class="nr">المعتاد ${nr[0]}–${nr[1]}</small>` : ''}
  </div>`;
/* Curtain sub-sections: frame position (Panto, Wrap, BVD) · segment heights · IPD (mono PDs + total) */
const GROUPS = [
  ['🕶️ وضع الفريم على الوش', ['panto', 'wrap', 'bvd']],
  ['↕️ ارتفاع السيجمنت', ['segR', 'segL']],
  ['↔️ المسافة الحدقية', ['pdR', 'pdL']]
];
$('fields').innerHTML = GROUPS.map(([ar, keys], gi) => `
  <div class="sub"><button class="sbh"><span>${ar}</span></button><div class="sbb"><div class="in"><div class="pad">
    <div class="cells">${keys.map(k => fieldHTML(FIELDS.find(f => f[0] === k))).join('')}${gi === 2 ? '<div class="cell tot"><div class="cl"><span class="en">Total PD</span><span class="ar">الكلية</span></div><b id="total">0.0</b></div>' : ''}</div>
  </div></div></div></div>`).join('');
document.querySelectorAll('.sbh').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('open')));
function checkRanges(){
  for (const [k, , , , , nr] of FIELDS){
    const el = $(k), v = parseFloat(el.value);
    el.classList.toggle('warn', !!nr && v !== 0 && (v < nr[0] || v > nr[1]));
  }
  $('total').textContent = (parseFloat($('pdR').value) + parseFloat($('pdL').value)).toFixed(1);
}
FIELDS.forEach(([k]) => $(k).addEventListener('change', checkRanges));

const ORDER_PREFIX = 'TBK-2500';
const orderFull = () => { const t = $('order').value.trim(); return t ? ORDER_PREFIX + t : ''; };
function zeroMeasures(){ FIELDS.forEach(([k]) => { $(k).value = '0'; }); checkRanges(); }
/* ---- 📎 attachments: new files (uploaded to Drive on save) + links already saved with the record ---- */
let attNew = [], attSaved = [];
const MAX_MB = 15;
function renderAtt(){
  const box = $('attList'); box.innerHTML = '';
  attSaved.forEach((u, i) => {
    const c = document.createElement('div'); c.className = 'chip saved';
    c.innerHTML = `<a href="${u}" target="_blank" rel="noopener">📎 مرفق ${i + 1}</a><button title="شيل">✕</button>`;
    c.querySelector('button').onclick = () => { attSaved.splice(i, 1); renderAtt(); };
    box.appendChild(c);
  });
  attNew.forEach((f, i) => {
    const c = document.createElement('div'); c.className = 'chip';
    const isImg = /^image\//.test(f.type);

async function fileToB64(f){

      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

<script>
(() => {
  const W = document.getElementById('whl'), L = document.getElementById('whlL'), T = document.getElementById('whlT'), H = 44;
  let sel = null, items = [], cur = -1, armed = false, timer = 0, raf = 0;
  const idxNow = () => Math.max(0, Math.min(items.length - 1, Math.round(L.scrollTop / H)));

    armed = true; L.scrollTo({ top:i * H, behavior:'smooth' });
  });

    items = [...L.querySelectorAll('.it')];

  }

    const c = e.target.closest && e.target.closest('.cell');
    if (!c || W.contains(c)) return;
    const s = c.querySelector('select'); if (!s || s.disabled) return;
    const cl = c.querySelector('.cl, .lb');
    const en = cl && cl.querySelector('.en'), ar = cl && cl.querySelector('.ar');
    open(s, `${ar ? ar.textContent + ' ' : ''}${en ? `<span class="en">${en.textContent}</span>` : ''}`);
  });
})();
</script>
</body>
</html>
