name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk IHAB-LensForm-3D.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IHAB LensForm 3D v1.0.${{ github.run_number }}
          body: "IHAB LensForm 3D — محاكي سُمك العدسات. نزّل ملف IHAB-LensForm-3D.apk وثبّته."
          files: IHAB-LensForm-3D.apk
          make_latest: true
