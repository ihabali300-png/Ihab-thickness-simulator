name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle -p android assembleLiteRelease assembleFullRelease --no-daemon
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk IHAB-LensForm-3D.apk
          cp android/app/build/outputs/apk/full/release/app-full-release.apk IHAB-LensForm-3D-Pro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IHAB LensForm 3D v1.0.${{ github.run_number }}
          body: "IHAB LensForm 3D — IHAB-LensForm-3D.apk: المحاكي بس (للأصحاب) · IHAB-LensForm-3D-Pro.apk: النسخة Pro — المحاكي + الكارت (لإيهاب بس)"
          files: |
            IHAB-LensForm-3D.apk
            IHAB-LensForm-3D-Pro.apk
          make_latest: true
